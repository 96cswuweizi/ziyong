<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>吴文卓的个人博客</title>
    <link rel="icon" href="./images/logo2.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Monaco', monospace;
            background-color: #0a192f;
            color: #64ffda;
            overflow: hidden;
            height: 100vh;
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">\
                    <path fill="%2364ffda" d="M2,2 L12,12 L8,12 L2,18 L2,2"/>\
                </svg>') 2 2, auto;
            touch-action: none;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 20px;
        }

        .glitch-title {
            font-size: 4em;
            margin-bottom: 20px;
            position: relative;
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
        }

        .nav-buttons {
            display: flex;
            gap: 20px;
            margin-top: 40px;
        }

        .nav-button {
            padding: 12px 24px;
            background: transparent;
            border: 2px solid #64ffda;
            border-radius: 8px;
            color: #64ffda;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            position: relative;
            overflow: hidden;
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">\
                    <path fill="%2364ffda" d="M1,12 L1,17 C1,18.1,1.9,19,3,19 L11,19 C12.1,19,13,18.1,13,17 L13,7 L11,7 L11,14 L9,14 L9,5 L7,5 L7,14 L5,14 L5,3 L3,3 L3,14 L1,14 Z"/>\
                </svg>') 1 1, pointer;
        }

        .nav-button:hover {
            background: rgba(100, 255, 218, 0.1);
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">\
                    <path fill="%2364ffda" filter="drop-shadow(0 0 2px %2364ffda)" d="M1,12 L1,17 C1,18.1,1.9,19,3,19 L11,19 C12.1,19,13,18.1,13,17 L13,7 L11,7 L11,14 L9,14 L9,5 L7,5 L7,14 L5,14 L5,3 L3,3 L3,14 L1,14 Z"/>\
                </svg>') 1 1, pointer;
        }

        .nav-button::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 50%;
            width: 0;
            height: 0;
            background: rgba(100, 255, 218, 0.1);
            border-radius: 50%;
            transform: translate(-50%, -50%);
            transition: width 0.6s, height 0.6s;
        }

        .nav-button:hover::before {
            width: 300px;
            height: 300px;
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .typing-text-1 {
            border-right: 2px solid #64ffda;
            white-space: nowrap;
            overflow: hidden;
            margin: 0 auto;
            letter-spacing: 2px;
            width: 0;
            animation: 
                typing1 3.5s steps(40, end) forwards,
                blink-caret 0.75s step-end infinite;
        }

        .typing-text-2 {
            font-size: 1.8em;
            font-family: "Segoe UI", "Microsoft YaHei", "微软雅黑", sans-serif;
            font-weight: 300;
            margin: 25px auto 40px;
            border-right: 2px solid #64ffda;
            white-space: nowrap;
            overflow: hidden;
            letter-spacing: 3px;
            width: 0;
            opacity: 0;
            color: rgba(100, 255, 218, 0.9);
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.3);
            animation: 
                typing2 3.5s steps(40, end) forwards,
                blink-caret 0.75s step-end infinite;
            animation-delay: 3.5s;
        }

        @keyframes typing1 {
            from { width: 0 }
            to { width: 9em }
        }

        @keyframes typing2 {
            from { 
                width: 0;
                opacity: 1;
            }
            to { 
                width: 11em;
                opacity: 1;
            }
        }

        @keyframes blink-caret {
            from, to { border-color: transparent }
            50% { border-color: #64ffda }
        }

        /* 简化头像样式 */
        .avatar-container {
            margin-bottom: 30px;
            opacity: 0;
            animation: fadeIn 2s ease forwards;
            animation-delay: 0.5s;
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            transition: all 0.3s ease;
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">\
                    <path fill="%2364ffda" d="M1,12 L1,17 C1,18.1,1.9,19,3,19 L11,19 C12.1,19,13,18.1,13,17 L13,7 L11,7 L11,14 L9,14 L9,5 L7,5 L7,14 L5,14 L5,3 L3,3 L3,14 L1,14 Z"/>\
                </svg>') 1 1, pointer;
        }

        .avatar:hover {
            transform: translateY(-5px);
            box-shadow: 0 0 20px rgba(100, 255, 218, 0.3);
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">\
                    <path fill="%2364ffda" filter="drop-shadow(0 0 2px %2364ffda)" d="M1,12 L1,17 C1,18.1,1.9,19,3,19 L11,19 C12.1,19,13,18.1,13,17 L13,7 L11,7 L11,14 L9,14 L9,5 L7,5 L7,14 L5,14 L5,3 L3,3 L3,14 L1,14 Z"/>\
                </svg>') 1 1, pointer;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 修改移动端媒体查询部分 */
        @media screen and (max-width: 768px) {
            .content {
                padding: 20px;
                justify-content: center;  /* 改回居中布局 */
                padding-top: 0;  /* 移除顶部额外padding */
                min-height: 100vh;  /* 确保至少占满整个视口高度 */
            }

            .avatar-container {
                margin-bottom: 25px;  /* 增加头像下方间距 */
            }

            .avatar {
                width: 80px;
                height: 80px;
            }

            .glitch-title {
                font-size: 1.6em;
                margin-bottom: 15px;
            }

            .typing-text-2 {
                font-size: 1.2em;
                margin: 15px auto 35px;  /* 增加下方间距 */
            }

            .nav-buttons {
                flex-direction: column;
                gap: 15px;  /* 稍微增加按钮间距 */
                width: 80%;
                max-width: 250px;
            }

            .nav-button {
                padding: 10px 20px;  /* 调整按钮内边距 */
                width: 100%;  /* 按钮占满容器宽度 */
                font-size: 0.9em;  /* 调整按钮字体大小 */
            }

            @keyframes typing1 {
                from { width: 0 }
                to { width: 9.5em }
            }

            @keyframes typing2 {
                from { 
                    width: 0;
                    opacity: 1;
                }
                to { 
                    width: 10em;
                    opacity: 1;
                }
            }

            .typing-text-1, .typing-text-2 {
                letter-spacing: 1px;
            }
        }

        /* 添加超小屏幕的适配 */
        @media screen and (max-width: 320px) {
            .content {
                padding-top: 40px;
            }

            .avatar {
                width: 70px;
                height: 70px;
            }

            .glitch-title {
                font-size: 1.4em;
            }

            .typing-text-2 {
                font-size: 1.1em;
            }

            .nav-button {
                padding: 8px 16px;
                font-size: 0.85em;
            }
        }

        /* 添加横屏适配 */
        @media screen and (max-height: 500px) and (orientation: landscape) {
            .content {
                padding-top: 20px;
            }

            .avatar {
                width: 60px;
                height: 60px;
                margin-bottom: 10px;
            }

            .nav-buttons {
                flex-direction: row;  /* 横屏时按钮横向排列 */
                flex-wrap: wrap;  /* 允许按钮换行 */
                justify-content: center;
                width: 100%;
                gap: 10px;
            }

            .nav-button {
                width: auto;  /* 取消宽度限制 */
                min-width: 120px;
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <div class="content">
        <!-- 添加头像 -->
        <div class="avatar-container">
            <img src="./images/logo.png" alt="头像" class="avatar">
        </div>
        <h1 class="glitch-title typing-text-1">吴文卓的个人博客</h1>
        <p class="typing-text-2">探索技术的无限可能</p>
        <div class="nav-buttons">
            <a href="./blog.html" class="nav-button">博客文章</a>
            <a href="./gj.html" class="nav-button">工具集</a>
            <a href="./about.html" class="nav-button">关于我</a>
            <a href="./games.html" class="nav-button">小游戏</a>
        </div>
    </div>

    <script>
        // 粒子动画效果
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        // 设置canvas尺寸
        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        // 粒子类
        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 2;
                this.alpha = Math.random();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                this.alpha += (Math.random() - 0.5) * 0.01;
                if (this.alpha <= 0) this.alpha = 0;
                if (this.alpha >= 1) this.alpha = 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 255, 218, ${this.alpha})`;
                ctx.fill();
            }
        }

        // 创建粒子数组
        const particles = Array.from({ 
            length: window.innerWidth < 768 ? 50 : 100 
        }, () => new Particle());

        // 连线函数
        function drawLines() {
            particles.forEach((p1, i) => {
                particles.slice(i + 1).forEach(p2 => {
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(100, 255, 218, ${0.2 * (1 - distance / 100)})`;
                        ctx.stroke();
                    }
                });
            });
        }

        // 动画循环
        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            drawLines();
            requestAnimationFrame(animate);
        }

        animate();

        // 鼠标交互效果
        let mouseX = 0;
        let mouseY = 0;

        canvas.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;

            // 创建新粒子
            particles.push(new Particle());
            if (particles.length > 100) {
                particles.shift();
            }
        });

        // 添加动画结束监听器
        document.addEventListener('DOMContentLoaded', () => {
            const text1 = document.querySelector('.typing-text-1');
            const text2 = document.querySelector('.typing-text-2');

            // 第一段文字动画结束
            text1.addEventListener('animationend', (e) => {
                if (e.animationName === 'typing1') {
                    text1.style.borderRight = 'none';
                }
            });

            // 第二段文字动画结束
            text2.addEventListener('animationend', (e) => {
                if (e.animationName === 'typing2') {
                    text2.style.borderRight = 'none';
                }
            });
        });

        // 添加点击烟花特效
        function createFirework(x, y) {
            const particles = [];
            const particleCount = 30;
            const colors = ['#64ffda', '#9AECDB', '#26de81'];

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'fixed';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = '4px';
                particle.style.height = '4px';
                particle.style.borderRadius = '50%';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '1000';
                document.body.appendChild(particle);

                const angle = (Math.PI * 2 * i) / particleCount;
                const velocity = 3 + Math.random() * 3;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;

                particles.push({
                    element: particle,
                    x: x,
                    y: y,
                    vx: vx,
                    vy: vy,
                    alpha: 1
                });
            }

            let frame = 0;
            const animate = () => {
                frame++;
                let isAlive = false;

                particles.forEach(particle => {
                    if (particle.alpha <= 0) return;

                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += 0.05; // 添加重力效果
                    particle.alpha -= 0.01;

                    particle.element.style.transform = `translate(${particle.x - x}px, ${particle.y - y}px)`;
                    particle.element.style.opacity = particle.alpha;

                    if (particle.alpha > 0) isAlive = true;
                });

                if (isAlive && frame < 200) {
                    requestAnimationFrame(animate);
                } else {
                    particles.forEach(particle => {
                        if (particle.element.parentNode) {
                            particle.element.parentNode.removeChild(particle.element);
                        }
                    });
                }
            };

            requestAnimationFrame(animate);
        }

        // 添加点击事件监听器
        document.addEventListener('click', (e) => {
            // 忽略点击按钮和链接的情况
            if (e.target.tagName.toLowerCase() === 'a' || 
                e.target.tagName.toLowerCase() === 'button' ||
                e.target.classList.contains('nav-button') ||
                e.target.classList.contains('avatar')) {
                return;
            }
            createFirework(e.clientX, e.clientY);
        });
    </script>
</body>
</html>
