<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>关于我 - Tech Blog</title>
    <link rel="icon" href="./images/logo2.png" type="image/x-icon">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            cursor: inherit;
        }

        body {
            font-family: 'Monaco', monospace;
            background-color: #0a192f;
            color: #64ffda;
            overflow-x: hidden;
            min-height: 100vh;
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">\
                    <path fill="%2364ffda" d="M2,2 L12,12 L8,12 L2,18 L2,2"/>\
                </svg>') 2 2, auto;
        }

        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 1;
        }

        .content {
            position: relative;
            z-index: 2;
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }

        .back-button {
            position: fixed;
            top: 20px;
            left: 20px;
            padding: 10px 20px;
            background: transparent;
            border: 2px solid #64ffda;
            color: #64ffda;
            cursor: pointer;
            text-decoration: none;
            transition: all 0.3s ease;
            border-radius: 4px;
            font-size: 14px;
            z-index: 1000;
            display: inline-block;
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">\
                    <path fill="%2364ffda" d="M1,12 L1,17 C1,18.1,1.9,19,3,19 L11,19 C12.1,19,13,18.1,13,17 L13,7 L11,7 L11,14 L9,14 L9,5 L7,5 L7,14 L5,14 L5,3 L3,3 L3,14 L1,14 Z"/>\
                </svg>') 1 1, pointer !important;
        }

        .back-button:hover {
            background: rgba(100, 255, 218, 0.1);
            transform: translateY(-2px);
            box-shadow: 0 0 10px rgba(100, 255, 218, 0.2);
        }

        .back-button:active {
            transform: translateY(1px);
        }

        .profile-section {
            text-align: center;
            margin-bottom: 60px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
        }

        .profile-image {
            width: 200px;
            height: 200px;
            border-radius: 50%;
            margin-bottom: 20px;
            object-fit: cover;
        }

        .name {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 0 0 10px rgba(100, 255, 218, 0.5);
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">\
                    <path fill="%2364ffda" d="M8,2 L12,2 L12,4 L13,4 L13,6 L12,6 L12,14 L13,14 L13,16 L12,16 L12,18 L8,18 L8,16 L7,16 L7,14 L8,14 L8,6 L7,6 L7,4 L8,4 Z"/>\
                </svg>') 10 10, text;
        }

        .title {
            font-size: 1.2em;
            margin-bottom: 20px;
            color: rgba(100, 255, 218, 0.8);
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">\
                    <path fill="%2364ffda" d="M8,2 L12,2 L12,4 L13,4 L13,6 L12,6 L12,14 L13,14 L13,16 L12,16 L12,18 L8,18 L8,16 L7,16 L7,14 L8,14 L8,6 L7,6 L7,4 L8,4 Z"/>\
                </svg>') 10 10, text;
        }

        .about-section {
            background: rgba(100, 255, 218, 0.05);
            padding: 30px;
            border-radius: 10px;
            margin-bottom: 40px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 0.3s;
        }

        .section-title {
            font-size: 1.5em;
            margin-bottom: 20px;
            border-bottom: 2px solid #64ffda;
            padding-bottom: 10px;
        }

        .about-text {
            line-height: 1.8;
            margin-bottom: 20px;
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 20 20">\
                    <path fill="%2364ffda" d="M8,2 L12,2 L12,4 L13,4 L13,6 L12,6 L12,14 L13,14 L13,16 L12,16 L12,18 L8,18 L8,16 L7,16 L7,14 L8,14 L8,6 L7,6 L7,4 L8,4 Z"/>\
                </svg>') 10 10, text;
        }

        .skills-section {
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 0.6s;
        }

        .skills-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .skill-item {
            background: rgba(100, 255, 218, 0.1);
            padding: 10px;
            border-radius: 5px;
            text-align: center;
            transition: all 0.3s ease;
            text-decoration: none;
            color: #64ffda;
            display: block;
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">\
                    <path fill="%2364ffda" d="M1,12 L1,17 C1,18.1,1.9,19,3,19 L11,19 C12.1,19,13,18.1,13,17 L13,7 L11,7 L11,14 L9,14 L9,5 L7,5 L7,14 L5,14 L5,3 L3,3 L3,14 L1,14 Z"/>\
                </svg>') 1 1, pointer !important;
        }

        .skill-item:hover {
            transform: translateY(-5px);
            background: rgba(100, 255, 218, 0.2);
            color: #64ffda;
        }

        .contact-section {
            text-align: center;
            margin-top: 40px;
            opacity: 0;
            transform: translateY(20px);
            animation: fadeInUp 0.8s ease forwards;
            animation-delay: 0.9s;
        }

        .social-links {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        .social-link {
            color: #64ffda;
            text-decoration: none;
            padding: 10px 20px;
            border: 1px solid #64ffda;
            border-radius: 5px;
            transition: all 0.3s ease;
            cursor: url('data:image/svg+xml;utf8,\
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">\
                    <path fill="%2364ffda" d="M1,12 L1,17 C1,18.1,1.9,19,3,19 L11,19 C12.1,19,13,18.1,13,17 L13,7 L11,7 L11,14 L9,14 L9,5 L7,5 L7,14 L5,14 L5,3 L3,3 L3,14 L1,14 Z"/>\
                </svg>') 1 1, pointer !important;
        }

        .social-link:hover {
            background: rgba(100, 255, 218, 0.1);
        }

        @keyframes fadeInUp {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 移动端适配 */
        @media screen and (max-width: 768px) {
            /* 内容区域调整 */
            .content {
                padding: 20px 15px;
            }

            /* 返回按钮调整 */
            .back-button {
                top: 10px;
                left: 10px;
                padding: 8px 15px;
                font-size: 12px;
            }

            /* 个人资料部分 */
            .profile-section {
                margin-bottom: 40px;
                margin-top: 50px;
            }

            .profile-image {
                width: 150px;
                height: 150px;
            }

            .name {
                font-size: 2em;
            }

            .title {
                font-size: 1em;
                padding: 0 20px;
            }

            /* 关于部分 */
            .about-section {
                padding: 20px;
                margin-bottom: 30px;
            }

            .section-title {
                font-size: 1.3em;
                margin-bottom: 15px;
            }

            .about-text {
                font-size: 0.9em;
                line-height: 1.6;
            }

            /* 技能网格 */
            .skills-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 10px;
            }

            .skill-item {
                padding: 8px;
                font-size: 0.9em;
            }

            /* 联系部分 */
            .contact-section {
                margin-top: 30px;
            }

            .social-links {
                flex-direction: column;
                gap: 10px;
            }

            .social-link {
                padding: 8px 15px;
                font-size: 0.9em;
            }

            /* 动画调整 */
            @keyframes fadeInUp {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
        }

        /* 针对更小屏幕的额外调整 */
        @media screen and (max-width: 320px) {
            .name {
                font-size: 1.8em;
            }

            .title {
                font-size: 0.9em;
            }

            .profile-image {
                width: 120px;
                height: 120px;
            }

            .skills-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>
    <a href="javascript:void(0)" class="back-button" onclick="goToHome()">返回首页</a>
    
    <div class="content">
        <div class="profile-section">
            <img src="./images/logo.png" alt="吴文卓" class="profile-image">
            <h1 class="name">吴文卓</h1>
            <p class="title">一个热衷分享开源技术的小小程序员</p>
        </div>

        <div class="about-section">
            <h2 class="section-title">关于我</h2>
            <p class="about-text">
                你好！我是吴文卓，一名充满热情的小小程序员。我热爱编程和技术创新，热衷于分享优雅且高效的工具app。
                
            </p>

                除了编程，我也热衷于分享技术知识和经验。通过这个博客，我希望能够与更多的开发者交流学习，共同进步。
            </p>
        </div>

        <div class="skills-section">
            <h2 class="section-title">开发环境下载</h2>
            <div class="skills-grid">
                <a href="https://code.visualstudio.com/" class="skill-item" target="_blank">VS Code</a>

                <a href="https://www.docker.com/products/docker-desktop" class="skill-item" target="_blank">Docker Desktop</a>
                <a href="https://www.postman.com/downloads/" class="skill-item" target="_blank">Postman</a>

            </div>
        </div>

        <div class="contact-section">
            <h2 class="section-title">联系我</h2>
            <div class="social-links">
                <a href="mailto:853258983@qq.com" class="social-link">Email</a>
            </div>
        </div>
    </div>

    <script>
        // 复用主页的粒子动画代码
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');

        function setCanvasSize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        setCanvasSize();
        window.addEventListener('resize', setCanvasSize);

        class Particle {
            constructor() {
                this.reset();
            }

            reset() {
                this.x = Math.random() * canvas.width;
                this.y = Math.random() * canvas.height;
                this.vx = (Math.random() - 0.5) * 2;
                this.vy = (Math.random() - 0.5) * 2;
                this.radius = Math.random() * 2;
                this.alpha = Math.random();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if (this.x < 0 || this.x > canvas.width) this.vx *= -1;
                if (this.y < 0 || this.y > canvas.height) this.vy *= -1;

                this.alpha += (Math.random() - 0.5) * 0.01;
                if (this.alpha <= 0) this.alpha = 0;
                if (this.alpha >= 1) this.alpha = 1;
            }

            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.radius, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(100, 255, 218, ${this.alpha})`;
                ctx.fill();
            }
        }

        const particles = Array.from({ length: 100 }, () => new Particle());

        function drawLines() {
            particles.forEach((p1, i) => {
                particles.slice(i + 1).forEach(p2 => {
                    const dx = p1.x - p2.x;
                    const dy = p1.y - p2.y;
                    const distance = Math.sqrt(dx * dx + dy * dy);

                    if (distance < 100) {
                        ctx.beginPath();
                        ctx.moveTo(p1.x, p1.y);
                        ctx.lineTo(p2.x, p2.y);
                        ctx.strokeStyle = `rgba(100, 255, 218, ${0.2 * (1 - distance / 100)})`;
                        ctx.stroke();
                    }
                });
            });
        }

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            particles.forEach(particle => {
                particle.update();
                particle.draw();
            });

            drawLines();
            requestAnimationFrame(animate);
        }

        animate();

        canvas.addEventListener('mousemove', (e) => {
            const mouseX = e.clientX;
            const mouseY = e.clientY;

            particles.push(new Particle());
            if (particles.length > 100) {
                particles.shift();
            }
        });

        // 添加返回首页函数（放在现有 script 标签内的最后）
        function goToHome() {
            window.location.href = 'index.html';
        }

        // 添加点击烟花特效
        function createFirework(x, y) {
            const particles = [];
            const particleCount = 30;
            const colors = ['#64ffda', '#9AECDB', '#26de81'];

            for (let i = 0; i < particleCount; i++) {
                const particle = document.createElement('div');
                particle.style.position = 'fixed';
                particle.style.left = x + 'px';
                particle.style.top = y + 'px';
                particle.style.width = '4px';
                particle.style.height = '4px';
                particle.style.borderRadius = '50%';
                particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                particle.style.pointerEvents = 'none';
                particle.style.zIndex = '1000';
                document.body.appendChild(particle);

                const angle = (Math.PI * 2 * i) / particleCount;
                const velocity = 3 + Math.random() * 3;
                const vx = Math.cos(angle) * velocity;
                const vy = Math.sin(angle) * velocity;

                particles.push({
                    element: particle,
                    x: x,
                    y: y,
                    vx: vx,
                    vy: vy,
                    alpha: 1
                });
            }

            let frame = 0;
            const animate = () => {
                frame++;
                let isAlive = false;

                particles.forEach(particle => {
                    if (particle.alpha <= 0) return;

                    particle.x += particle.vx;
                    particle.y += particle.vy;
                    particle.vy += 0.05; // 添加重力效果
                    particle.alpha -= 0.01;

                    particle.element.style.transform = `translate(${particle.x - x}px, ${particle.y - y}px)`;
                    particle.element.style.opacity = particle.alpha;

                    if (particle.alpha > 0) isAlive = true;
                });

                if (isAlive && frame < 200) {
                    requestAnimationFrame(animate);
                } else {
                    particles.forEach(particle => {
                        if (particle.element.parentNode) {
                            particle.element.parentNode.removeChild(particle.element);
                        }
                    });
                }
            };

            requestAnimationFrame(animate);
        }

        // 添加点击事件监听器
        document.addEventListener('click', (e) => {
            // 忽略点击按钮、链接和其他可交互元素
            if (e.target.tagName.toLowerCase() === 'a' || 
                e.target.tagName.toLowerCase() === 'button' ||
                e.target.classList.contains('back-button') ||
                e.target.classList.contains('skill-item') ||
                e.target.classList.contains('social-link') ||
                e.target.classList.contains('profile-image')) {
                return;
            }
            createFirework(e.clientX, e.clientY);
        });
    </script>
</body>
