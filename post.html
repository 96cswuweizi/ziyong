<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>文章阅读 - 吴文卓的个人博客</title>
<link rel="icon" href="./images/logo2.png" type="image/x-icon">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style type="text/css">
* { box-sizing: border-box; }

body {
    margin: 0;
    font-family: 'Microsoft YaHei', 微软雅黑, sans-serif;
    background-color: #0a192f;
    color: #8892b0;
    overflow-x: hidden;
    min-height: 100vh;
}

#canvas {
    position: fixed;
    top: 0;
    left: 0;
    z-index: -1;
}

.back-home {
    position: fixed;
    top: 20px;
    left: 20px;
    display: inline-block;
    color: #ccd6f6;
    text-decoration: none;
    padding: 8px 16px;
    border: 1px solid #233554;
    border-radius: 4px;
    transition: all 0.3s ease;
    background-color: rgba(10, 25, 47, 0.7);
    font-size: 14px;
    z-index: 100;
}

.back-home:hover {
    background-color: rgba(100, 255, 218, 0.1);
    transform: translateY(-2px);
    color: #64ffda;
    border-color: #64ffda;
}

.back-blog {
    position: fixed;
    top: 20px;
    right: 20px;
    display: inline-block;
    color: #ccd6f6;
    text-decoration: none;
    padding: 8px 16px;
    border: 1px solid #233554;
    border-radius: 4px;
    transition: all 0.3s ease;
    background-color: rgba(10, 25, 47, 0.7);
    font-size: 14px;
    z-index: 100;
}

.back-blog:hover {
    background-color: rgba(100, 255, 218, 0.1);
    transform: translateY(-2px);
    color: #64ffda;
    border-color: #64ffda;
}

.content {
    position: relative;
    max-width: 820px;
    margin: 0 auto;
    padding: 90px 24px 60px;
}

.post-header {
    text-align: center;
    margin-bottom: 40px;
    padding-bottom: 25px;
    border-bottom: 1px solid #233554;
}

.post-title {
    color: #ccd6f6;
    font-size: 2em;
    font-weight: bold;
    margin: 0 0 15px;
    line-height: 1.4;
}

.post-meta {
    font-size: 0.9em;
    color: #8892b0;
}

.post-meta .tag {
    display: inline-block;
    padding: 2px 8px;
    margin: 0 3px;
    border-radius: 3px;
    background-color: rgba(100, 255, 218, 0.1);
    color: #64ffda;
    font-size: 0.85em;
}

.post-body {
    line-height: 1.8;
    font-size: 16px;
    background: rgba(17, 34, 64, 0.4);
    border: 1px solid #233554;
    border-radius: 10px;
    padding: 30px 35px;
    backdrop-filter: blur(5px);
}

/* markdown 渲染样式 */
.post-body h1, .post-body h2, .post-body h3, .post-body h4 {
    color: #ccd6f6;
    margin: 1.4em 0 0.6em;
    line-height: 1.4;
}
.post-body h1 { font-size: 1.6em; border-bottom: 1px solid #233554; padding-bottom: 0.4em; }
.post-body h2 { font-size: 1.35em; border-bottom: 1px solid #233554; padding-bottom: 0.3em; }
.post-body h3 { font-size: 1.15em; }
.post-body p { margin: 0.9em 0; }
.post-body a { color: #64ffda; text-decoration: none; border-bottom: 1px dashed rgba(100,255,218,0.4); }
.post-body a:hover { border-bottom-style: solid; }
.post-body strong { color: #ccd6f6; }
.post-body img {
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    border: 1px solid #233554;
    margin: 10px 0;
    display: block;
}
.post-body ul, .post-body ol { padding-left: 1.6em; margin: 0.9em 0; }
.post-body li { margin: 0.4em 0; }
.post-body blockquote {
    margin: 1em 0;
    padding: 10px 18px;
    border-left: 3px solid #64ffda;
    background: rgba(100, 255, 218, 0.05);
    border-radius: 0 6px 6px 0;
    color: #a8b2d1;
}
.post-body code {
    background: #0d1f38;
    border: 1px solid #233554;
    border-radius: 4px;
    padding: 2px 7px;
    color: #64ffda;
    font-size: 0.9em;
    font-family: Consolas, Monaco, monospace;
}
.post-body pre {
    background: #0d1f38;
    border: 1px solid #233554;
    border-radius: 8px;
    padding: 16px 18px;
    overflow-x: auto;
    line-height: 1.5;
}
.post-body pre code {
    background: none;
    border: none;
    padding: 0;
    color: #a8b2d1;
}
.post-body table {
    border-collapse: collapse;
    width: 100%;
    margin: 1em 0;
    font-size: 0.95em;
}
.post-body th, .post-body td {
    border: 1px solid #233554;
    padding: 8px 12px;
    text-align: left;
}
.post-body th { color: #64ffda; background: rgba(100, 255, 218, 0.05); }
.post-body tr:nth-child(even) { background: rgba(17, 34, 64, 0.3); }
.post-body hr { border: none; border-top: 1px solid #233554; margin: 2em 0; }

.error-box {
    text-align: center;
    padding: 60px 20px;
    color: #8892b0;
}

@media (max-width: 768px) {
    .content { padding: 80px 12px 40px; }
    .post-body { padding: 20px 18px; font-size: 15px; }
    .post-title { font-size: 1.5em; }
    .back-home, .back-blog { top: 10px; padding: 6px 12px; font-size: 12px; }
}
</style>
<link rel="stylesheet" href="./assets/geek.css">
</head>

<body>
<canvas id="canvas"></canvas>
<a href="index.html" class="back-home">返回主页</a>
<a href="blog.html" class="back-blog">返回博客列表</a>

<div class="content">
    <div class="post-header">
        <h1 class="post-title" id="postTitle">加载中...</h1>
        <div class="post-meta" id="postMeta"></div>
    </div>
    <div class="post-body" id="postBody">
        <p style="text-align:center;color:#8892b0;">正在加载文章内容...</p>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
(function(){
    var params = new URLSearchParams(location.search);
    var file = params.get('p');

    function showError(msg){
        document.getElementById('postTitle').textContent = '出错了';
        document.getElementById('postBody').innerHTML = '<div class="error-box">' + msg + '</div>';
    }

    if(!file || !/^[\w\u4e00-\u9fa5\-./ ]+$/.test(file)){
        showError('缺少文章参数，请从 <a href="blog.html" style="color:#64ffda;">博客列表</a> 进入。');
        return;
    }

    // 从 data/blog.json 里找同名文章的元信息（标题/日期/标签）
    fetch('./data/blog.json', {cache: 'no-cache'})
        .then(function(r){ return r.ok ? r.json() : []; })
        .catch(function(){ return []; })
        .then(function(posts){
            var meta = posts.filter(function(p){ return p.file === file; })[0] || {};
            document.getElementById('postTitle').textContent = meta.title || (file.split('/').pop().replace(/\.md$/i, ''));
            var tags = (meta.tags || []).map(function(t){
                return '<span class="tag">' + t + '</span>';
            }).join('');
            document.getElementById('postMeta').innerHTML =
                (meta.date ? '发布时间：' + meta.date : '') + tags;

            // 拉取 markdown 正文
            return fetch('./' + file, {cache: 'no-cache'});
        })
        .then(function(r){
            if(!r.ok) throw new Error(r.status);
            return r.text();
        })
        .then(function(text){
            var html = marked.parse(text);
            document.getElementById('postBody').innerHTML = html;
            document.title = document.getElementById('postTitle').textContent + ' - 吴文卓的个人博客';
        })
        .catch(function(){
            showError('文章加载失败（' + file + '），请刷新重试。');
        });
})();
</script>

<script>
// 背景粒子动画（与博客列表页一致）
var canvas = document.getElementById('canvas');
var ctx = canvas.getContext('2d');
var particles = [];

function resizeCanvas() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

class Particle {
    constructor() { this.reset(); }
    reset() {
        this.x = Math.random() * canvas.width;
        this.y = Math.random() * canvas.height;
        this.vx = (Math.random() - 0.5) * 0.5;
        this.vy = (Math.random() - 0.5) * 0.5;
        this.size = Math.random() * 2;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        if (this.x < 0 || this.x > canvas.width || this.y < 0 || this.y > canvas.height) this.reset();
    }
    draw() {
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(100, 255, 218, 0.5)';
        ctx.fill();
    }
}

for (var i = 0; i < 80; i++) particles.push(new Particle());

function connectParticles() {
    for (var i = 0; i < particles.length; i++) {
        for (var j = i + 1; j < particles.length; j++) {
            var dx = particles[i].x - particles[j].x;
            var dy = particles[i].y - particles[j].y;
            var d = Math.sqrt(dx * dx + dy * dy);
            if (d < 100) {
                ctx.beginPath();
                ctx.strokeStyle = 'rgba(100, 255, 218, ' + (0.2 * (1 - d / 100)) + ')';
                ctx.lineWidth = 0.5;
                ctx.moveTo(particles[i].x, particles[i].y);
                ctx.lineTo(particles[j].x, particles[j].y);
                ctx.stroke();
            }
        }
    }
}

(function animate() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach(function(p){ p.update(); p.draw(); });
    connectParticles();
    requestAnimationFrame(animate);
})();
</script>
<script src="./assets/geek.js"></script>
</body>
</html>
